services:
  - type: web
    name: lumenworks-x402-decoder
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUBLIC_BASE
        value: https://lumenworks-x402-decoder.onrender.com
      - key: STATS_GIST_ID
        sync: false
      - key: STATS_GIST_TOKEN
        sync: false
      - key: STATS_SALT
        sync: false
